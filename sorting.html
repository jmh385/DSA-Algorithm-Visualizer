<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Algorithms Visualization</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="sorting-page">
    <h1>Sorting Visualizer</h1>
    <p><a href="index.html">← Back to home</a></p>
    <input type="text" id="userInput" placeholder="Enter numbers separated by commas">
    <select id="algorithm">
      <option value="bubble">Bubble Sort</option>
      <option value="selection">Selection Sort</option>
      <option value="insertion">Insertion Sort</option>
      <option value="quick">Quick Sort</option>
      <option value="merge">Merge Sort</option>
    </select>
    <button id="startBtn">Start</button>
    <button id="exampleBtn">Run Example</button>
    <div id="visualizer"></div>
    <p id="explanationText"></p>

    <!-- Algorithm Code Section -->
    <div id="code-section">
      <h2>Algorithm Code</h2>
      <pre id="algorithm-code"></pre>
    </div>
  </div>

  <script src="js/sorting.js"></script>
</body>
</html>
