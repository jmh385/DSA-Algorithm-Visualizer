<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorithm Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="welcome-screen" class="welcome-container">
    <h1 class="welcome-title">Algorithm Visualizer</h1>
    <div class="options">
      <a href="#" class="option" id="sorting-option">Sorting Algorithms</a>
      <a href="graph.html" class="option" id="graph-option">Graph Algorithms</a>
      <a href="tree.html" class="option" id="tree-option">Tree Algorithms</a>
      <a href="search.html" class="option" id="search-page-link">Searching Algorithms</a>
    </div>
    <div class="option1">
      <a href="stack.html" class="option" id="stack-page">Stack Visualizer</a>
      <a href="queue.html" class="option" id="queue-page">Queue Visualizer</a>
      <a href="linkedlist.html" class="option" id="linkedlist-page">Linked List Visualizer</a>
      <a href="rw.html" class="option" id="Real-World">Real world problems</a>
    </div>
  </div>

  <div id="sorting-visualizer">
    <h1>Sorting Visualizer</h1>
    <input type="text" id="userInput" placeholder="Enter numbers separated by commas">
    <select id="algorithm">
      <option value="bubble">Bubble Sort</option>
      <option value="selection">Selection Sort</option>
      <option value="insertion">Insertion Sort</option>
      <option value="quick">Quick Sort</option>
      <option value="merge">Merge Sort</option>
    </select>
    <button id="startBtn">Start</button>
    <button id="exampleBtn">Run Example</button>
    <div id="visualizer"></div>
    <p id="explanationText"></p>

    <!-- Algorithm Code Section -->
    <div id="code-section">
      <h2>Algorithm Code</h2>
      <pre id="algorithm-code"></pre>
    </div>
  </div>

  <script src="js/sorting.js"></script>
</body>
</html>
